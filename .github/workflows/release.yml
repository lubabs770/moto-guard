name: release-apk

# On-demand release: Actions -> release-apk -> Run workflow, enter a version.
# Builds the signed APK and publishes a GitHub Release (creating the tag).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag / version (e.g. v0.3.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # create the tag + release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Hoisted to job env so steps can gate on it — `secrets` isn't allowed in `if`.
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      # Inject the escape-hatch secrets from repo Secrets so they never live in git.
      - name: Inject secrets
        env:
          ADB_SECRET: ${{ secrets.ADB_SECRET }}
          SMS_SECRET: ${{ secrets.SMS_SECRET }}
          SMS_ALLOWED_SENDERS: ${{ secrets.SMS_ALLOWED_SENDERS }}
        run: |
          CFG=app/src/main/java/com/lubabs770/motoguard/Config.kt
          if [ -n "$ADB_SECRET" ]; then
            sed -i "s|const val ADB_SECRET = \".*\"|const val ADB_SECRET = \"$ADB_SECRET\"|" "$CFG"
          fi
          if [ -n "$SMS_SECRET" ]; then
            sed -i "s|const val SMS_SECRET = \".*\"|const val SMS_SECRET = \"$SMS_SECRET\"|" "$CFG"
          fi
          if [ -n "$SMS_ALLOWED_SENDERS" ]; then
            sed -i "s|const val SMS_ALLOWED_SENDERS = \".*\"|const val SMS_ALLOWED_SENDERS = \"$SMS_ALLOWED_SENDERS\"|" "$CFG"
          fi

      - name: Decode signing keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
