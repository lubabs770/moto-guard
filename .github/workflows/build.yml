name: build-apk

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:
  # Tagging vX.Y.Z also publishes the APK to a GitHub Release.

permissions:
  contents: write   # needed for the release step on tags

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Hoisted to job env so steps can gate on it — `secrets` isn't allowed in `if`.
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      # No secret injection: the keyholder's code is chosen on the device and
      # stored only as a hash. Nothing about the lock is a build input, so
      # whoever builds this APK still cannot open the device with it.

      - name: Decode signing keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: moto-guard-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
